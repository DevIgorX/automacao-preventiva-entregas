<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Performance de Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="{url_for('static', filename='index.css')}" rel="stylesheet"> 
    <script src="{{url_for('static', filename='index.js')}}" defer></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-truck-flatbed"></i>
                <strong>Sistema de Monitoramento de Entregas</strong>
            </a>
        </div>
    </nav>

   <div class="main-container">
    <div class="container py-5">
        <div class="card p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h1 class="card-title text-primary">Análise de Performance</h1>
                    <p class="text-muted">
                        Faça o upload dos arquivos de preventiva e do relatório de entregas para gerar um relatório de performance detalhado.
                    </p>
                </div>
                
                <form id="analysis-form" method="post" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="preventiva" class="form-label fw-bold">1. Arquivo de Preventiva</label>
                        <input type="file" id="preventiva" name="preventiva" class="form-control" required accept=".csv, .xlsx">
                        <div class="form-text">Envie o arquivo que começa com "cd-etapa".</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="relatorio" class="form-label fw-bold">2. Relatório de Entregas</label>
                        <input type="file" id="relatorio" name="relatorio" class="form-control" required accept=".xls">
                        <div class="form-text">Envie o relatório do Mobile Entregas.</div>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button id="submit-button" type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-bar-chart-line-fill"></i> Analisar Arquivos
                        </button>
                        <button id="loading-button" class="btn btn-primary btn-lg" type="button" disabled style="display:none;">
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                            Processando... Por favor, aguarde.
                        </button>
                    </div>
                </form>
            </div>
        </div>
      </div>
   </div>
</body>
</html>
