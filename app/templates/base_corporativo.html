<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Porta-a-Porta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css_corporativo/style_corporativo.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename= 'js_preventiva/analise_preventiva.css')}}">

</head>
<body>
    <div id="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header text-center">
                <h3>Porta-a-Porta</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="{{ url_for('rotas.pagina_inicial') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="{{ url_for('rotas.analise_performance') }}"><i class="bi bi-graph-up-arrow"></i> Performance</a></li>
                <li><a href="{{ url_for('rotas.pagina_analise') }}"><i class="bi bi-file-earmark-diff"></i> Analise Preventiva</a></li>
                <li class="nav-item mt-auto"><a href="{{ url_for('rotas.excluir_dados') }}"><i class="bi bi-database-dash"></i> Limpar Dados</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light navbar-custom py-3 px-4">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-dark">
                        <i class="bi bi-text-indent-left"></i>
                    </button>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="me-3 text-muted">Usuário: Admin</span>
                        <a href="#" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</a>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-5">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js_preventiva/main.js') }}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('sidebarCollapse').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>
</html>
