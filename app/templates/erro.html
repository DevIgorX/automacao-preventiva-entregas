{% extends 'base_template.html' %}

{% block title %} Erro na Análise {% endblock %}

{% block content %}
<div class="main-container">
    <div class="container py-5">
        <div class="card p-4 shadow-lg">
            <div class="card-body text-center">
                <h1 class="card-title text-danger">
                    <i class="bi bi-x-octagon-fill"></i>
                    Ocorreu um Erro
                </h1>
                <p class="text-muted">
                    Não foi possível processar os arquivos. Verifique a mensagem de erro abaixo e tente novamente.
                </p>

                <div class="alert alert-danger text-start" role="alert">
                    <h5 class="alert-heading">Detalhes do Erro:</h5>
                    <pre class="mb-0" style="white-space: pre-wrap;">{{ erro }}</pre>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <a href="{{url_for('rotas.excluir_dados')}}" class="btn btn-primary btn-lg">
                        <i class="bi bi-arrow-left-circle"></i> Voltar e Tentar Novamente
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
