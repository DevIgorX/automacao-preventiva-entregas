{% extends "base_corporativo.html" %}

{% block title %}Acesso Restrito{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 mt-5">
                <div class="card-header bg-dark text-white text-center py-3 shadow-sm">
                    <h4 class="mb-0"><i class="fas fa-lock me-2"></i>Acesso Restrito</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-center text-muted mb-4">
                        A atualização da base de dados é uma ação crítica. Por favor, insira a senha de administrador para continuar.
                    </p>
                    
                    <form method="POST" action="{{ url_for('rotas.rota_acesso_base') }}">
                        <div class="mb-4">
                            <label for="senha" class="form-label fw-bold text-dark">Senha de Acesso</label>
                            <input type="password" class="form-control form-control-lg" id="senha" name="senha" placeholder="Digite a senha..." required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                <i class="fas fa-key me-2"></i>Desbloquear Acesso
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
