<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Portal Porta-a-Porta {% endblock %}</title>
    <!-- <link rel="icon" href="../static/imagem_logo.jpeg"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="stylesheet" href="{{url_for('static', filename='css_corporativo/style_corporativo.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename= 'style_preventiva/analise_preventiva.css')}}">

</head>
<body>
    <div id="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header text-center">
                <h3>Porta-a-Porta</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="{{ url_for('rotas.pagina_inicial') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="{{ url_for('rotas.excluir_dados')}}"><i class="bi bi-graph-up-arrow"></i> Performance</a></li>
                <li><a href="{{ url_for('rotas.limpar_arquivo') }}"><i class="bi bi-file-earmark-diff"></i> Analise Preventiva</a></li>
                <li class="nav-item mt-auto"><a href="{{ url_for('rotas.excluir_dados') }}"><i class="bi bi-database-dash"></i> Limpar Dados</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light navbar-custom py-2 px-3">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-dark">
                        <i class="bi bi-text-indent-left"></i>
                    </button>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="me-3 text-muted">Usuário: Admin</span>
                        <a href="#" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</a>
                    </div>
                </div>
            </nav>

            <div class="container-fluid pt-2 px-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% block scripts %}{% endblock %}
    <script src="{{url_for('static',filename='js_corporativo/base.js')}}"></script>
    <script src="{{url_for('static', filename='js_preventiva/main.js')}}" ></script>
</body>
</html>
