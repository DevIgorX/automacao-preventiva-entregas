{% extends "base_corporativo.html" %}

{% block content %}

<div id="loader-overlay" class="style_loade">
    <div class="text-center">
        <i class="fas fa-spinner fa-spin fa-4x text-primary mb-3"></i>
        <h4 class="text-dark">Processando dados...</h4>
    </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 text-dark"><i class="bi bi-graph-up-arrow me-2"></i>Análise de Performance</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-1">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 text-primary">Upload de Arquivos</h5>
                <small class="text-muted">Selecione os arquivos específicos para o cruzamento de dados.</small>
            </div>
            <div class="card-body p-4">
                <form id="form-analise" action="{{ url_for('rotas.analise_performance') }}" method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-4">
                        <label for="preventiva" class="form-label fw-bold text-secondary">Planilha de Preventiva (CD Etapa)</label>
                        <input type="file" name="preventiva" id="preventiva" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label for="relatorio" class="form-label fw-bold text-secondary">Relatório Mobile Entregas</label>
                        <input type="file" name="relatorio" id="relatorio" class="form-control" required>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('rotas.pagina_inicial') }}" class="btn btn-outline-danger px-4">Limpar Arquivos</a>
                        <button type="submit" class="btn btn-primary px-5">
                            <i class="bi bi-cpu me-2"></i>Processar Performance
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
